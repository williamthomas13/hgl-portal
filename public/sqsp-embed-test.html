<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGL homepage strip — embed QA</title>
<style>
  /* crude Squarespace-ish page styles to prove no clash */
  body { font-family: Georgia, serif; margin: 0; background: #faf8f5; }
  .sqs-section { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
  a { color: #7a2048; }
  .qa { font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #64748b; border-top: 1px dashed #cbd5e1; margin-top: 48px; padding-top: 12px; }
  .qa a { color: #00AEEE; margin-right: 10px; }
</style></head>
<body>
  <div class="sqs-section">
    <!-- PL-506: the embed renders its OWN headline now — the Squarespace block carries no heading of its own.
         HGL embed: paste once, never edit again -->
    <div id="hgl-upcoming-classes">
      <noscript><a href="/classes">See upcoming classes →</a></noscript>
    </div>
    <!-- Relative src: resolves against whichever host serves this page. The REAL sqsp snippet
         (decommission checklist step 9b) stays absolute — sqsp is a different host.
         ?preview=<state> on THIS page is forwarded to the script so every state can be eyeballed
         from synthetic rows (never touches data). -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search).get('preview');
        var s = document.createElement('script');
        s.src = '/embed/upcoming-classes.js' + (p ? '?preview=' + encodeURIComponent(p) : '');
        s.defer = true;
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
  </div>
  <div class="sqs-section">
    <!-- PL-507: the homepage "Meet our team" section — the embed carries the heading; the block has none of its own.
         HGL team embed: paste once, never edit again -->
    <div id="hgl-team">
      <noscript><a href="/team">Meet the team →</a></noscript>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(location.search).get('preview');
        var s = document.createElement('script');
        s.src = '/embed/team.js' + (p ? '?preview=' + encodeURIComponent(p) : '');
        s.defer = true;
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
    <p class="qa">QA states (synthetic rows, never data):
      <a href="?">live</a>
      <a href="?preview=upcoming4">upcoming4</a>
      <a href="?preview=upcoming2">upcoming2</a>
      <a href="?preview=upcoming1-current">upcoming1-current</a>
      <a href="?preview=current">current</a>
      <a href="?preview=recent">recent</a>
      <a href="?preview=empty">empty</a>
      · team: <a href="?preview=team-empty">team-empty</a> (the classes strip above renders its own empty state with that value)
    </p>
  </div>
</body></html>
