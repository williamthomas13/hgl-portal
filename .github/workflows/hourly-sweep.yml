# The hourly sweep — BACKUP + MANUAL trigger since PL-273 (Aug 6 2026).
#
# PRIMARY is now Supabase pg_cron (job hgl-hourly-sweep at :05, plus
# hgl-sweep-watch at :35 — see scripts/setup-pl273-pg-cron.mjs), scheduled
# independently of both GitHub and Vercel. This workflow stays because:
#   - Run workflow (workflow_dispatch) is the one-click manual recovery
#     path — exactly what fixed the Aug 6 outage;
#   - its best-effort hourly schedule is a free extra layer if pg_cron ever
#     stops (the sweep is idempotent — overlapping runs are safe; every send
#     dedupes and claims are optimistic).
# The Aug 6 outage (runs #85/#86: GitHub runner-acquisition failures + a
# 5-hour scheduling gap) is why this scheduler is no longer trusted as
# primary. vercel.json keeps its DAILY cron as a third backstop (Hobby caps
# crons at daily; on Vercel Pro it could go hourly too — Aug 20 decision).
name: hourly-sweep
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Hit the sweep endpoint
        run: |
          code=$(curl -s -o /tmp/sweep-body -w "%{http_code}" --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://hgl-portal.vercel.app/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/sweep-body
          # Fail the job on anything but 200 so a broken sweep is VISIBLE in
          # the Actions tab instead of silently skipped.
          [ "$code" = "200" ]
